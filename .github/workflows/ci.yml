name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy strict)
        run: mypy src tests
      - name: Unit, integration & security regression tests
        run: pytest -q
      - name: Internal benchmark gate (no false positives/negatives)
        run: |
          python - <<'PY'
          from nulltrace.benchmark import run_benchmark
          r = run_benchmark(profile="comprehensive")
          assert r.overall.fp == 0, f"false positives: {r.overall.to_dict()}"
          assert r.overall.fn == 0, f"false negatives: {r.overall.to_dict()}"
          assert r.overall.tp > 0
          print("benchmark gate passed:", r.overall.to_dict())
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend for image
        run: cd frontend && npm ci && npm run build
      - name: Build image
        run: docker build -t nulltrace-ai:ci .
      - name: Smoke test container
        run: |
          docker run -d --name nt -p 8787:8787 nulltrace-ai:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/api/health && break || sleep 1
          done
          curl -sf http://127.0.0.1:8787/api/health
          docker rm -f nt
