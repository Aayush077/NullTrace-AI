[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nulltrace-ai"
version = "0.5.0"
description = "Evidence-first security assessment framework for LLM applications and AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<15.0",
    "httpx>=0.28.1,<0.29",
    "httpcore>=1.0.9,<1.1",
    "idna>=3.4,<4",
    # The web dashboard (FastAPI backend + ASGI server) is a first-class
    # feature, so these are runtime dependencies rather than optional
    # extras. Keeping them required means `uv sync` / `uv run` always
    # provide them, so the server starts without falling back to a global
    # uvicorn on PATH.
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
nulltrace = "nulltrace.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
